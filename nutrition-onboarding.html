<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Nutrition questionnaire — YouDeserveWell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/nutrition.css" />
</head>
<body class="n-body">
  <header class="n-topbar">
    <a class="n-brand" href="/nutrition">You<span>Deserve</span>Well · Nutrition</a>
    <nav class="n-topbar-actions"><a href="/nutrition">Cancel</a></nav>
  </header>

  <main class="n-shell">
    <div class="n-spinner" id="loading"></div>

    <form id="wizard" hidden>
      <div class="n-wizard-progress" id="progress" aria-hidden="true"></div>
      <h1 class="n-h1" id="step-title"></h1>
      <p class="n-lead" id="step-lead"></p>

      <div id="steps"></div>

      <p class="n-disclaimer" id="wizard-disclaimer" hidden></p>
      <p class="n-gap critical" id="wizard-error" hidden></p>

      <div class="n-wizard-nav">
        <button type="button" class="n-btn ghost" id="back">Back</button>
        <button type="button" class="n-btn" id="next">Next</button>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="/js/nutrition/onboarding-page.js"></script>
</body>
</html>
